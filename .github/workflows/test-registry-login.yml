name: Test registry-login
on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  push-pull-sign:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - id: login
        uses: ./registry-login
      - name: Check the image output
        env:
          IMAGE: ${{ steps.login.outputs.image }}
        run: test "$IMAGE" = registry.cloudinabottle.org/actions
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f  # v3.12.0
      - id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8  # v6.19.2
        with:
          context: .
          file: registry-login/test.Dockerfile
          push: true
          tags: ${{ steps.login.outputs.image }}/registry-login-test:${{ github.sha }}
      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532  # v4.1.3
      - name: Sign
        run: cosign sign --yes "${{ steps.login.outputs.image }}/registry-login-test@${{ steps.build.outputs.digest }}"
      - name: Pull anonymously and verify
        env:
          REF: ${{ steps.login.outputs.image }}/registry-login-test@${{ steps.build.outputs.digest }}
        run: |
          docker logout registry.cloudinabottle.org
          docker pull "$REF"
          cosign verify "$REF" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            --certificate-identity "https://github.com/${GITHUB_REPOSITORY}/.github/workflows/test-registry-login.yml@refs/heads/main"
